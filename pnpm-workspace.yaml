# pnpm 11 부터 nodeLinker 등 핵심 설정은 .npmrc 가 아니라 이 파일에 둔다.
# isolated 설치는 react-native-google-mobile-ads / view-shot / chart-kit 이
# 호환되지 않을 수 있어 hoisted 로 시작한다 (Expo 공식 가이드의 안전한 기본값).
nodeLinker: hoisted

# 빌드(postinstall) 스크립트는 기본 차단이라 필요한 것만 허용한다.
# unrs-resolver 는 eslint-config-expo 가 끌어오며 플랫폼 바인딩을 검증한다.
allowBuilds:
  unrs-resolver: true

# 보안 픽스 강제. 전부 expo CLI / metro / config-plugins 경유의 빌드 타임 전이 의존이라
# 런타임 번들에는 들어가지 않지만 audit 을 0 으로 유지하기 위해 상향한다.
# pnpm 11 은 package.json 의 pnpm 필드(pnpm.overrides)를 읽지 않으므로 반드시 여기 둔다.
# 템플릿이므로 새 앱은 이 블록을 그대로 물려받는다.
# xcode 의 uuid 만 중첩 오버라이드 문법(부모>자식)을 쓴다.
overrides:
  xcode>uuid: ^11.1.1
  # image-size 는 GHSA 권고의 패치 버전(>=2.0.3)이 아직 배포되지 않아 오버라이드하지 않는다.
  # 2.0.3 이 올라오면 여기에 추가한다.
  decode-uri-component: '>=0.4.3'
  # xmldom 은 0.8 계열(plist)과 0.9 계열이 함께 쓰여 API 가 달라 한 메이저로 통일할 수 없다.
  # 메이저별 선택자로 각각 패치 버전만 올린다.
  '@xmldom/xmldom@0.8': '>=0.8.15 <0.9'
  '@xmldom/xmldom@0.9': '>=0.9.12 <1'
